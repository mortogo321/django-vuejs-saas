name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Code quality — Ruff (backend) + Biome (frontend)
  # ============================================================
  quality-backend:
    name: "Quality · Backend (Ruff)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.16.9

      - name: Ruff lint
        working-directory: server
        run: ruff check .

      - name: Ruff format check
        working-directory: server
        run: ruff format --check .

  quality-frontend:
    name: "Quality · Frontend (Biome + typecheck)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Biome check (lint + format)
        working-directory: frontend
        run: bun run ci:check

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  # ============================================================
  # 2. Tests — backend pytest + frontend vitest
  # ============================================================
  test-backend:
    name: "Test · Backend (pytest)"
    needs: [quality-backend, quality-frontend]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U saas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend deps
        run: pip install -r server/requirements.txt

      - name: Run pytest
        working-directory: server
        run: pytest -q

  test-frontend:
    name: "Test · Frontend (vitest)"
    needs: [quality-backend, quality-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Run vitest
        working-directory: frontend
        run: bun run test

  # ============================================================
  # 3. Builds — backend + frontend images, frontend prod bundle
  # ============================================================
  build:
    name: "Build · Docker + frontend bundle"
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: runtime
          build-args: APP_ENV=prod
          additional-contexts: infra=./docker/backend
          push: false
          load: true
          tags: django-vuejs-saas-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          build-args: APP_ENV=prod
          additional-contexts: infra=./docker/frontend,nginx=./docker/nginx
          push: false
          load: true
          tags: django-vuejs-saas-frontend:ci

      - name: Validate compose configs
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.uat.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
